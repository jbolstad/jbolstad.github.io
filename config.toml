baseurl = "https://www.boelstad.net/"

enableRobotsTXT = true
canonifyURLs = true # Using this with domain as base makes share links work

DefaultContentLanguage = "en"
title = "Jørgen Bølstad"
theme = "beautifulhugo"
metaDataFormat = "yaml"
#pygmentsUseClasses = true
#pygmentsCodeFences = true
#pygmentsCodefencesGuessSyntax = true
ignoreFiles = ["\\.psd$", "\\.Rmd$", "\\.Rmarkdown$", "_files$", "_cache$"]
#pygmentsStyle = "trac"
#pygmentsUseClassic = true
#pygmentOptions = "linenos=inline"

# Blogdown knits Rmd posts to HTML under content/; Hugo 0.162+ denies that by default.
[security]
  allowContent = ["text/html", "text/markdown"]
[services]
  [services.disqus]
    shortname = "boelstad-net"
  [services.rss]
    limit = 3

[Params]
  homeTitle = "Playing with Numbers" # Set a different text for the header on the home page
  subtitle = "Notes on Bayesian Statistics"
  #logo = "img/avatar-icon.png"
  #favicon = "img/avatar-favicon.ico"
  dateFormat = "January 2, 2006"
  commit = false
  rss = false
  comments = true
  readingTime = true
  #useHLJS = true
  socialShare = true
  socialSharePage = false # Turn off sharing for pages (about)
#  gcse = "012345678901234567890:abcdefghijk" # Get your code from google.com/cse. Make sure to go to "Look and Feel" and change Layout to "Full Width" and Theme to "Classic"

[[Params.bigimg]]
  src = "img/bgimgshort.jpg"
# src = "img/MCMCbgimg.jpg"
  #desc = "Weisshorn, Valais"
#[[Params.bigimg]]
#  src = "img/triangle.jpg"
#  desc = "Triangle"
#[[Params.bigimg]]
#  src = "img/sphere.jpg"
#  desc = "Sphere"
#  # position: see values of CSS background-position.
#  position = "center top"
#[[Params.bigimg]]
#  src = "img/hexagon.jpg"
#  desc = "Hexagon"

[Params.author]
  name = "Jørgen Bølstad"
  website = "www.boelstad.net"
  email = "j.b [AT] post.harvard.edu"
  twitter = "boelstad"
  linkedin = "boelstad"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[[menu.main]]
    name = "Archive"
    url = "/post/"
    weight = 1

[[menu.main]]
    name = "About"
    url = "/page/about/"
    weight = 2

